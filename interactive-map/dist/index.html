<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/interactive-map/dist/vite.svg" />
  
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d6d2ca" />
  <title>Digital Twin - Interactive Map</title>
  <script type="module" crossorigin src="/interactive-map/dist/assets/index-b07ba1b7.js"></script>
  <link rel="stylesheet" href="/interactive-map/dist/assets/index-477331dd.css">
</head>

<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-wrapper">
      <div class="counter-section">
        <div class="loading-progress" id="counter">0%</div>
        <div class="loading-label">Loading</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Experience -->
  <div class="experience">
    <canvas class="experience-canvas"></canvas>
  </div>

  <!-- Navbar -->
  <header>
    <img class="logo" id="logoReset" src="/interactive-map/dist/images/logo-reset.svg" alt="Logo-reset" style="cursor: pointer;">
  </header>

  <!-- ===== TOP RIGHT CAMERA CONTROLS ===== -->
  <div class="camera-controls" id="cameraControls">
    <button class="cam-btn active" data-view="isometric">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
      </svg>
      <span class="label">Isometric</span>
    </button>
    <button class="cam-btn" data-view="top">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span class="label">Top</span>
    </button>
    <button class="cam-btn" data-view="plan">
      <svg viewBox="0 0 24 24">
        <path d="M3 3h18v18H3z"></path>
        <path d="M3 9h18M9 21V9"></path>
      </svg>
      <span class="label">Plan</span>
    </button>
  </div>

  <!-- Main -->
  <main>
    <!-- 🌡️ Sensor Points of Interest (Mapped to Interests.js) -->
    <div class="point temp1">
      <div class="label">
        <img src="/interactive-map/dist/images/icon-sensor.svg" alt="Temperature" style="width: 28px; height: 28px;">
      </div>
      <div class="text">Temp #1</div>
    </div>
    <div class="point temp2">
      <div class="label">
        <img src="/interactive-map/dist/images/icon-sensor.svg" alt="Temperature" style="width: 28px; height: 28px;">
      </div>
      <div class="text">Temp #2</div>
    </div>
    <div class="point temp3">
      <div class="label">
        <img src="/interactive-map/dist/images/icon-sensor.svg" alt="Temperature" style="width: 28px; height: 28px;">
      </div>
      <div class="text">Temp #3</div>
    </div>
    <div class="point motion">
      <div class="label">
        <img src="/interactive-map/dist/images/icon-sensor.svg" alt="Motion" style="width: 28px; height: 28px;">
      </div>
      <div class="text">Occupancy Sensor</div>
    </div>
    <div class="point co2">
      <div class="label">
        <img src="/interactive-map/dist/images/icon-sensor.svg" alt="TVOC Sensor" style="width: 28px; height: 28px;">
      </div>
      <div class="text">CO2-TVOC Sensor</div>
    </div>
    <div class="point server">
      <div class="label">
        <img src="/interactive-map/dist/images/icon-sensor.svg" alt="Server" style="width: 28px; height: 28px;">
      </div>
      <div class="text">Server Node</div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
      <div class="info-panel-header">
        <img class="close" src="/interactive-map/dist/images/icn-close.svg" alt="Close" style="cursor: pointer;">
      </div>
      <div class="info-panel-content">
        <div class="info-panel-content-wrapper">
          <img class="info-panel-image" src="" alt="Sensor Overview">
          <img class="info-panel-logo" src="" alt="Sensor Icon">
          <h2 class="info-panel-title"></h2>
          <p class="info-panel-lead"></p>
          <p class="info-panel-description"></p>

          <div class="info-panel-stats">
            <div class="stat">
              <span class="stat-label">Today</span>
              <span class="stat-value info-panel-stat-today"></span>
            </div>
            <div class="stat info-panel-stat2">
              <span class="stat-label info-panel-stat2-label"></span>
              <span class="stat-value info-panel-stat2-value"></span>
            </div>
            <div class="stat info-panel-stat3">
              <span class="stat-label info-panel-stat3-label"></span>
              <span class="stat-value info-panel-stat3-value"></span>
            </div>
          </div>

          <p class="info-panel-meta"></p>

          <a class="info-panel-website" href="#" target="_blank">
            <button>Telemetry Dashboard</button>
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer">
      <!-- Left: Mouse Logo -->
      <div class="footer-left">
        <div class="mouse-logo-wrapper">
          <img class="logo-mouse" src="/interactive-map/dist/images/logo-mouse.svg" alt="Logo Mouse">
          <div class="mouse-controls-text">
            <span class="control-label">Mouse Controls</span>
            <span>Left - Rotate</span>
            <span>Right - Move</span>
            <span>Middle - Zoom</span>
          </div>
        </div>
      </div>

      <!-- Center: Created by -->
      <div class="footer-center">
        <div class="designed-by">
          Created by <a href="https://www.linkedin.com/in/vinay-dilip/" target="_blank">Vinay Dilip</a>
        </div>
      </div>

      <!-- Right: View Code -->
      <div class="footer-right">
        <div class="links">
          <a href="https://github.com/vinaydj" target="_blank">View Code</a>
        </div>
      </div>
    </div>
  </footer>

  
</body>

</html>
